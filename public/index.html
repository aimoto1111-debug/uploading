<style id="main-css">
/* レイアウト：ゆるい色の帯を重ねたお菓子箱。注目作は大きなカード、その他は2〜3列のカード */
:root{
  --bg:#fff8f1; --paper:#ffffff; --ink:#3a3047; --sub:#7b6f86; --line:#efe3d8;
  --peach:#ffb4a2; --mint:#9fe3c9; --lilac:#c9b6ff; --butter:#ffe08a; --sky:#a8d8ff; --rose:#ff8fab;
  --accent:#ff6f91; --accentInk:#ffffff; --chip:#fff0e6; --shadow:0 10px 28px rgba(122,84,120,.12);
  --display:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1a2b; --paper:#2a2440; --ink:#f4ecff; --sub:#b9aed0; --line:#3a3254;
  --peach:#d98a7a; --mint:#5fb79a; --lilac:#8f7ad6; --butter:#d9b65a; --sky:#5f9fd1; --rose:#d86a88;
  --accent:#ff86a6; --accentInk:#1e1a2b; --chip:#352d4f; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1a2b; --paper:#2a2440; --ink:#f4ecff; --sub:#b9aed0; --line:#3a3254;
  --peach:#d98a7a; --mint:#5fb79a; --lilac:#8f7ad6; --butter:#d9b65a; --sky:#5f9fd1; --rose:#d86a88;
  --accent:#ff86a6; --accentInk:#1e1a2b; --chip:#352d4f; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
/* ヘッダー */
.hero{position:relative;padding-block:48px 28px;display:grid;gap:18px;overflow:hidden}
.hero .eyebrow{font-weight:800;letter-spacing:.2em;color:var(--sub);font-size:13px}
.hero h1{font-size:clamp(38px,8vw,72px);letter-spacing:.02em}
.hero h1 .dot{color:var(--accent)}
.hero p{max-width:34em;margin:0;color:var(--sub);font-size:17px}
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:-1}
.bubbles i{position:absolute;border-radius:50%;opacity:.55;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.bubbles i{animation:none}}
.nav{display:flex;flex-wrap:wrap;gap:10px}
.nav a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px}
.nav a:hover,.nav a:focus-visible{border-color:var(--accent);outline:none}
.nav b{font-family:var(--display);font-weight:400;color:var(--accent)}
/* セクション見出し */
.sec{padding-block:28px 12px}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px 16px;margin-bottom:18px}
.sec-h h2{font-size:clamp(26px,4.4vw,36px)}
.sec-h p{margin:0;color:var(--sub)}
.wave{height:14px;background:radial-gradient(circle at 10px -4px,transparent 12px,var(--line) 13px,transparent 14px) 0 0/20px 14px repeat-x;margin-block:8px 0;opacity:.9}
/* 注目作 */
.feature{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;background:var(--paper);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
.feature .art{position:relative;min-height:280px;background:var(--lilac)}
.feature .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .badge,.cover .badge{position:absolute;left:14px;top:14px;z-index:1}
.feature .art svg{position:absolute;inset:0;width:100%;height:100%}
.feature .art .glyph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:64px;color:#fff;text-shadow:0 3px 0 rgba(58,48,71,.25)}
.feature .txt{padding:26px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.feature h3{font-size:clamp(26px,3.6vw,34px)}
.feature .catch{font-weight:800;color:var(--accent);margin:0}
.feature p{margin:0}
.shots{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.shots figure{margin:0;flex:0 0 auto;scroll-snap-align:start;max-width:78vw}
.shot{padding:0;border:0;background:none;cursor:zoom-in;display:block;border-radius:14px}
.shot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shots img{height:220px;width:auto;max-width:78vw;object-fit:cover;border-radius:14px;border:3px solid var(--line);display:block;background:var(--chip)}
.card .shots img{height:150px}
.shots figcaption{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
.points{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.points li{display:flex;gap:10px;align-items:flex-start}
.points li::before{content:"";flex:0 0 10px;height:10px;border-radius:50%;margin-top:.62em;background:var(--mint)}
.feature:nth-of-type(2n) .points li::before{background:var(--peach)}
/* 小さいカード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .2s}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.cover{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .glyph{position:relative;font-family:var(--display);font-size:46px;color:#fff;text-shadow:0 3px 0 rgba(58,48,71,.25)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:22px}
.card .catch{margin:0;font-weight:800;color:var(--sub);font-size:14px}
.card p{margin:0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:800;background:var(--chip);border-radius:999px;padding:2px 10px;color:var(--ink)}
.note{font-size:12px;font-weight:700;color:var(--rose)}
.play{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accentInk);text-decoration:none;font-weight:800;border-radius:999px;padding:9px 20px;box-shadow:0 4px 0 rgba(58,48,71,.18);transition:transform .15s}
.play:hover{transform:translateY(-2px)}
.play:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
.play svg{width:16px;height:16px}
.badge{display:inline-block;font-family:var(--display);font-size:13px;background:var(--butter);color:#3a3047;border-radius:999px;padding:3px 12px}
footer{padding-block:36px 48px;color:var(--sub);font-size:13px;text-align:center}
@media (max-width:760px){.feature{grid-template-columns:minmax(0,1fr)}.feature .art{min-height:0;aspect-ratio:3/2}.feature .txt{padding:20px}}

/* 公開ページのおまけ */
.draftbar{margin-top:16px;background:var(--butter);color:#3a3047;border-radius:16px;padding:10px 16px;font-weight:700;font-size:14px}
footer p{margin:0 0 8px}
.adminlink{font-size:12px;color:var(--sub)}
.lb{border:0;border-radius:20px;padding:12px;background:var(--paper);color:var(--ink);max-width:min(94vw,900px);box-shadow:var(--shadow)}
.lb::backdrop{background:rgba(30,26,43,.7)}

.lb p{margin:8px 4px 0;text-align:center;font-weight:700}

.sub,.hint{color:var(--sub);margin:0;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.saved{font-size:14px;font-weight:700;color:var(--accent)}
.btn{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px}

.gi{flex:1 1 150px;min-width:0;display:grid}
.gi b{overflow-wrap:anywhere}
.gi small{color:var(--sub)}

.form textarea{resize:vertical;line-height:1.6}
.form input[type=color]{width:100%;height:44px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.chk{display:flex!important;align-items:center;gap:8px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
fieldset{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-weight:800;padding:0 6px}
.cover-edit{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cover-edit .form{flex:1;min-width:min(100%,240px)}
.filebtn{position:relative;overflow:hidden;justify-self:start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}

.shotlist li{display:grid;gap:6px;border:2px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.shotlist img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:var(--chip)}
.msg{margin:0;font-weight:700;color:var(--rose);min-height:1.5em}
.login{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px;max-width:360px;display:grid;gap:14px;justify-items:center;margin:0 auto}
.login label{font-weight:800}
.login input{font:inherit;font-family:var(--display);font-size:32px;letter-spacing:.5em;text-align:center;width:100%;max-width:220px;border:2px solid var(--line);border-radius:16px;padding:8px 0 8px .5em;background:var(--bg);color:var(--ink)}
.pins{display:flex;gap:12px}
.pins i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pins i.on{background:var(--accent)}
.editor{border:3px solid var(--accent)}
#app.booting{min-height:100vh;opacity:0}
#app{transition:opacity .25s}
</style>

function shrink(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);

        let u = c.toDataURL('image/webp', .8); if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/jpeg', .82);
        res(u);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    }
    const r = await fetch('/api/site', { method: 'POST', headers: { ...pinHeader(), 'content-type': 'application/json' }, body: JSON.stringify(d) });
    if (r.status === 401) { s.textContent = 'パスワードの確認が切れました。もう一度入りなおしてください。'; sess.set('komorebi-admin', ''); setTimeout(render, 1500); return; }
    if (!r.ok) throw new Error('save ' + r.status);
    dirty = false; s.textContent = '更新しました。サイトを開いている人は、再読みこみで新しい内容が見られます。';
  } catch (_) { s.textContent = '更新に失敗しました。通信を確かめて、もう一度押してください。'; }
  b.disabled = false;
}
function saveDraft() {
  const s = $('#saved');
  if (editing) { s.textContent = '編集中のゲームがあります。先に「この内容で決定」か「やめる」を押してください。'; return; }
  const ok = store.set(DRAFT_KEY, JSON.stringify(collect()));
  if (ok) { usingDraft = true; dirty = false; s.textContent = 'この端末に下書きを保存しました。全員に見せるには「書き出し」したファイルをNetlifyにアップしてください。'; }
  else s.textContent = 'このブラウザでは保存できませんでした（容量か設定の制限）。「書き出し」でファイルにしてください。';
}
async function exportSite() {
  const s = $('#saved');
  if (editing) { s.textContent = '編集中のゲームがあります。先に「この内容で決定」か「やめる」を押してください。'; return; }
  const html = buildDocument(collect()), filename = 'index.html';
  if (downloadsNs) { try { await downloadsNs.save({ filename, data: new Blob([html], { type: 'text/html' }) }); s.textContent = 'index.html を書き出しました。'; } catch (_) { s.textContent = '書き出しはキャンセルされました。'; } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  s.textContent = 'index.html を書き出しました。Netlifyの同じサイトにアップしてください。';
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ===== 切りかえ =====
function render() {
  if (location.hash === '#admin') { if (sess.get('komorebi-admin') === '1') renderAdmin(); else renderLogin(); window.scrollTo(0, 0); }
  else renderPublic();
}
window.addEventListener('hashchange', () => { if (app.classList.contains('booting')) return; if (location.hash === '#admin' || document.querySelector('.admin')) render(); });
// ===== Netlify のサーバー機能（あれば使う） =====
let apiMode = false;
async function boot() {
  if (!inClaude && /^https?:$/.test(location.protocol)) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch('/api/site', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
      if (r.ok && (r.headers.get('content-type') || '').includes('json')) {
        const j = await r.json();
        if (j && j.server === 'komorebi') { apiMode = true; if (j.data && j.data.games) { data = j.data; } usingDraft = false; store.del(DRAFT_KEY); }
      }
    } catch (_) { }
  }
  app.classList.remove('booting'); render();
}
boot();
})();
